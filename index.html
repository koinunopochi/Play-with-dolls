<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Play with Dolls — サムネ構図ラフ</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #1a1a1a; color: #eee;
    display: flex; flex-direction: column;
  }
  #ui {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 8px 10px;
    background: #222; border-bottom: 1px solid #333;
  }
  .group {
    display: flex; gap: 4px;
    padding: 4px; border: 1px solid #333; border-radius: 6px;
  }
  .group::before {
    content: attr(data-label);
    font-size: 11px; color: #888;
    align-self: center; padding: 0 6px;
  }
  button {
    background: #333; color: #eee; border: 1px solid #444;
    padding: 6px 10px; border-radius: 4px; cursor: pointer;
    font-size: 13px;
  }
  button:hover { background: #3d3d3d; }
  button.active { background: #4a7; border-color: #6c9; }
  #stage { flex: 1; position: relative; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #hint {
    position: absolute; left: 10px; bottom: 10px;
    background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 4px;
    font-size: 12px; color: #ccc; pointer-events: none;
  }
</style>
</head>
<body>
  <div id="ui">
    <div class="group" data-label="追加">
      <button data-add="mannequin">人</button>
      <button data-add="box">□</button>
      <button data-add="cylinder">●柱</button>
      <button data-add="sphere">○球</button>
    </div>
    <div class="group" data-label="操作">
      <button data-mode="translate" class="active">移動</button>
      <button data-mode="rotate">回転</button>
      <button data-mode="scale">スケール</button>
    </div>
    <div class="group" data-label="選択">
      <button id="parentBtn" title="親(関節→人形ルート)へ">親へ</button>
      <button id="deleteBtn">削除</button>
      <button id="deselectBtn">選択解除</button>
    </div>
    <div class="group" data-label="出力">
      <button id="exportBtn">PNG出力</button>
      <button id="resetBtn">リセット</button>
    </div>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hint">クリックで選択 / ドラッグで操作 / 右ドラッグで視点回転 / ホイールでズーム</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
