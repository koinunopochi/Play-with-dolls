<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Play with Dolls — サムネ構図ラフ</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #1a1a1a; color: #eee;
    display: flex; flex-direction: column;
  }
  #ui {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 8px 10px;
    background: #222; border-bottom: 1px solid #333;
  }
  .group {
    display: flex; gap: 4px; align-items: center;
    padding: 4px 6px; border: 1px solid #333; border-radius: 6px;
  }
  .group-label {
    font-size: 11px; color: #888;
    padding-right: 4px;
  }
  button {
    background: #333; color: #eee; border: 1px solid #444;
    padding: 6px 9px; border-radius: 4px; cursor: pointer;
    font-size: 12px; line-height: 1; white-space: nowrap;
  }
  button:hover { background: #3d3d3d; }
  button.active { background: #4a7; border-color: #6c9; color: #062; }
  button.primary { background: #36a; border-color: #58c; }
  button.primary:hover { background: #47b; }

  #stage {
    flex: 1; min-height: 0; position: relative;
    background: #0a0a0a;
    display: flex; align-items: center; justify-content: center;
    padding: 12px;
  }
  /* 16:9 viewport — what you see = exported crop. JSがピクセルでサイズを決める */
  #viewport {
    position: relative;
    background: #f2f2f2;
    box-shadow: 0 0 0 2px #ffcc00, 0 8px 30px rgba(0,0,0,0.4);
  }
  #fit {
    position: relative;
    height: 100%; width: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #frame-label {
    position: absolute; top: -22px; left: 0;
    font-size: 11px; color: #ffcc00;
    font-weight: 600; letter-spacing: 0.05em;
  }
  #hint {
    position: absolute; left: 16px; bottom: 16px;
    background: rgba(0,0,0,0.55); padding: 6px 10px; border-radius: 4px;
    font-size: 11px; color: #ddd; pointer-events: none;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div id="ui">
    <div class="group">
      <span class="group-label">追加</span>
      <button data-add="mannequin">人</button>
      <button data-add="box">□</button>
      <button data-add="cylinder">●柱</button>
      <button data-add="sphere">○球</button>
    </div>
    <div class="group">
      <span class="group-label">操作 [G/R/S]</span>
      <button data-mode="translate" class="active">移動</button>
      <button data-mode="rotate">回転</button>
      <button data-mode="scale">スケール</button>
      <button id="snapBtn" title="移動0.25 / 回転15° / スケール0.1">スナップ</button>
    </div>
    <div class="group">
      <span class="group-label">選択</span>
      <button id="parentBtn" title="関節→人形ルート">親へ</button>
      <button id="deleteBtn">削除</button>
      <button id="deselectBtn">解除</button>
    </div>
    <div class="group">
      <span class="group-label">ポーズ</span>
      <button data-pose="reset">立ち</button>
      <button data-pose="tpose">T</button>
      <button data-pose="apose">A</button>
      <button data-pose="armsup">バンザイ</button>
      <button data-pose="walk">歩き</button>
      <button data-pose="sit">座り</button>
    </div>
    <div class="group">
      <span class="group-label">カメラ</span>
      <button data-cam="front">正面</button>
      <button data-cam="threeQ">斜め</button>
      <button data-cam="side">横</button>
      <button data-cam="back">後</button>
      <button data-cam="high">俯瞰</button>
      <button data-cam="low">煽り</button>
    </div>
    <div class="group">
      <span class="group-label">出力</span>
      <button id="exportBtn" class="primary">PNG出力 (1920×1080)</button>
      <button id="resetBtn">リセット</button>
    </div>
  </div>
  <div id="stage">
    <div id="fit">
      <div id="viewport">
        <div id="frame-label">16 : 9 / EXPORT FRAME</div>
        <canvas id="c"></canvas>
      </div>
    </div>
    <div id="hint">
      クリックで選択 / ドラッグで操作 / 右ドラッグで視点 / ホイールでズーム<br>
      G:移動  R:回転  S:スケール  Esc:解除  Del:削除
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
